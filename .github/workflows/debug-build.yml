name: Debug APK Build

on:
  push:
    branches:
      - main

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        env:
          KAI_CODEXUI_API_KEY: ${{ secrets.KAI_CODEXUI_API_KEY }}
          CODEXUI_GATEWAY_TOKEN: ${{ secrets.CODEXUI_GATEWAY_TOKEN }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kai-codexui-debug-apk-${{ github.run_number }}-${{ github.run_attempt }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
