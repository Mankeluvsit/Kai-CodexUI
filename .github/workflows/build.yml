name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate self-signed debug keystore for release signing
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          keytool -genkeypair \
            -v \
            -storetype JKS \
            -keystore "$RUNNER_TEMP/keystore/debug-release.jks" \
            -alias debug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Assemble release APK (signed with generated keystore)
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/keystore/debug-release.jks
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_ALIAS: debug
          ANDROID_KEY_PASSWORD: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk

      # Optional production signing setup:
      # 1) In GitHub repo settings, create secrets:
      #    ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_RELEASE_KEYSTORE_PASSWORD,
      #    ANDROID_RELEASE_KEY_ALIAS, ANDROID_RELEASE_KEY_PASSWORD
      # 2) Add a step to decode the keystore:
      #      echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/keystore/release.jks
      # 3) Pass these as env vars to Gradle instead of the debug values above.
